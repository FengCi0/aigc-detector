name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: |
          python -m py_compile run.py backend/app.py backend/run.py backend/api/routes.py backend/models/detector.py backend/models/features.py backend/models/transformer_branch.py backend/train_model.py backend/train_transformer.py backend/utils/text_processing.py backend/scripts/prepare_massive_open_mix.py backend/scripts/evaluate_detector.py backend/scripts/tune_transformer_blend.py

      - name: Run backend tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend
        run: |
          cd frontend
          npm run build
